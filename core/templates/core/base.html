{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MLC{% endblock %} - Model Lifecycle Center</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'core/custom.css' %}">
    <script src="https://unpkg.com/htmx.org@1.9.10" defer></script>
</head>
<body>

    <div class="sidebar">
        <h1>MLC</h1>
        
        <div class="mb-4">
            <label for="baseModelSelect" class="form-label">Base Model</label>
            <select class="form-select" id="baseModelSelect">
                {% for model in base_models %}
                    <option value="{{ model.id }}" {% if model.id == selected_model_id %}selected{% endif %}>
                        {{ model.name }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <nav class="nav flex-column">
            <a class="nav-link {% if request.resolver_match.url_name == 'prediction_info' %}active{% endif %}" href="{% url 'core:prediction_info' %}">Prediction Information</a>
            <a class="nav-link {% if request.resolver_match.url_name == 'transaction_analysis' %}active{% endif %}" href="{% url 'core:transaction_analysis' %}">Transaction Analysis</a>
            <a class="nav-link {% if request.resolver_match.url_name == 'target_analysis' %}active{% endif %}" href="{% url 'core:target_analysis' %}">Target Analysis</a>
            <a class="nav-link {% if request.resolver_match.url_name == 'model_proving' %}active{% endif %}" href="{% url 'core:model_proving' %}">Model Proving</a>
            <a class="nav-link {% if request.resolver_match.url_name == 'forecasting' %}active{% endif %}" href="{% url 'core:forecasting' %}">Forecasting</a>
        </nav>
    </div>

    <main class="main-content">
        <div class="header">
            <h2>{% block page_title %}{% endblock %}</h2>
        </div>
        
        {% block content %}
        {% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
